<!DOCTYPE html>
<html lang="en-us">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<base href="https://cdn.jsdelivr.net/gh/isaidgg5/cheesium@main/">
<link href="https://fonts.upset.dev/css2?family=Figtree:ital,wght@0,300..900;1,300..900&display=swap" rel="stylesheet">
<title>The Binding of Isaac | gays.studio</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    background: #000;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
  }

  #container {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  ruffle-player {
    width: 100%;
    height: 100%;
  }

  #loader-screen {
    position: fixed;
    inset: 0;
    background: #000;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: 'Figtree', Arial, sans-serif;
    z-index: 999;
  }

  #loader-screen h1 {
    color: #fff;
    font-size: 2rem;
    margin-bottom: 24px;
    letter-spacing: 0.05em;
  }

  .file-row {
    display: flex;
    gap: 8px;
    font-size: 0.95rem;
    margin: 4px 0;
  }

  .file-name { color: #F5A9B8; }
  .file-status { color: #5BCEFA; }
  .file-status.pending { color: #888; }
</style>
</head>
<body>

<div id="loader-screen">
  <h1>loading...</h1>
  <img src="../../ritsu.gif" alt="ritsu" width="200" height="200" style="margin-bottom: 24px;" onerror="this.style.display='none'">
  <div class="file-row">
    <span class="file-name">issac.swf:</span>
    <span class="file-status pending" id="status-swf">waiting...</span>
  </div>
</div>

<div id="container"></div>

<script src="https://unpkg.com/@ruffle-rs/ruffle"></script>
<script>
  const SWF_FILE = "issac.swf";
  const SWF_PARTS = 3; // part0, part1, part2

  function mergeFiles(fileParts, onProgress) {
    return new Promise((resolve, reject) => {
      let buffers = [];

      function fetchPart(index) {
        if (index >= fileParts.length) {
          const totalLength = buffers.reduce((sum, buf) => sum + buf.byteLength, 0);
          const combined = new Uint8Array(totalLength);
          let offset = 0;
          for (const buf of buffers) {
            combined.set(new Uint8Array(buf), offset);
            offset += buf.byteLength;
          }
          const mergedBlob = new Blob([combined], { type: "application/octet-stream" });
          resolve(mergedBlob);
          return;
        }

        fetch(fileParts[index])
          .then(resp => {
            if (!resp.ok) throw new Error(`Failed to fetch ${fileParts[index]}`);
            return resp.arrayBuffer();
          })
          .then(data => {
            buffers.push(data);
            if (onProgress) onProgress(index + 1, fileParts.length);
            fetchPart(index + 1);
          })
          .catch(reject);
      }

      fetchPart(0);
    });
  }

  function getParts(file, totalParts) {
    let parts = [];
    for (let i = 0; i < totalParts; i++) {
      parts.push(`${file}.part${i}`);
    }
    return parts;
  }

  function setStatus(id, text, done) {
    const el = document.getElementById(id);
    el.textContent = text;
    el.classList.remove('pending');
    el.style.color = done ? '#00e676' : '#ffeb3b';
  }

  window.addEventListener("DOMContentLoaded", () => {
    setStatus('status-swf', 'merging... 0/' + SWF_PARTS);

    mergeFiles(getParts(SWF_FILE, SWF_PARTS), (done, total) => {
      setStatus('status-swf', `merging... ${done}/${total}`);
    })
    .then(blob => {
      setStatus('status-swf', 'done ✓', true);

      if (!window.RufflePlayer) {
        throw new Error("Ruffle player failed to load");
      }

      const blobUrl = URL.createObjectURL(blob);

      const ruffle = window.RufflePlayer.newest();
      const player = ruffle.createPlayer();
      player.style.width = "100%";
      player.style.height = "100%";

      const container = document.getElementById("container");
      container.appendChild(player);

      return Promise.resolve(player.load(blobUrl));
    })
    .then(() => {
      setTimeout(() => {
        document.getElementById('loader-screen').style.display = 'none';
      }, 500);
    })
    .catch(err => {
      console.error("Failed to load game:", err);
      document.getElementById('loader-screen').innerHTML =
        `<h1 style="color:#ff4444">Error loading game.<br><small style="font-size:0.8rem">${err.message}</small></h1>`;
    });
  });
</script>
</body>
</html>
